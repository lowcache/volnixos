"$schema" = 'https://starship.rs/config-schema.json'
palette = "m3"
right_format = """
[](primary_11)\
$cmd_duration\
[](fg:primary_11)"""

# ONE CONTINUOUS RAMP DOWN THE PRIMARY TONAL SCALE: primary_13 -> primary_1,
# thirteen steps, gold through brown to near-black. Modules sit on c0/c3/c6/c9
# (primary_13/10/7/4); the steps in between sit under the separator glyphs, and
# those wedges are what make it read as a gradient rather than four flat blocks.
#
# WHY THE TONAL SCALE AND NOT primary -> secondary -> tertiary. Those three are
# bunched at the light end (L* 82/72/67) and tertiary is sage, so any path
# through them spends ten of thirteen cells green and barely separates at the
# light end. The tonal ramp is one hue, evenly spaced by construction, and
# every cell is a Noctalia role -- so this whole gradient follows a scheme
# change for free, with no hex to recompute.
#
# TEXT INVERTS AT THE MIDPOINT and is measured, not eyeballed:
#   primary_13 band -> primary_4  text  10.2:1
#   primary_10 band -> primary_0  text   6.6:1   (L*60 is the squeeze: at that
#   primary_7  band -> primary_15 text   7.4:1    lightness nothing warm clears
#   primary_4  band -> primary_13 text  10.2:1    6:1 except pure black)
# The weakest pair still beats the 5.5:1 the old neutral_7 language band had.
format = """
[](primary_13)\
$time\
[](fg:primary_13 bg:primary_12)\
[](fg:primary_12 bg:primary_11)\
[](fg:primary_11 bg:primary_10)\
$memory_usage\
[](fg:primary_10 bg:primary_9)\
[](fg:primary_9 bg:primary_8)\
[](fg:primary_8 bg:primary_7)\
$git_branch\
$git_status\
${custom.ci}\
[](fg:primary_7 bg:primary_6)\
[](fg:primary_6 bg:primary_5)\
[](fg:primary_5 bg:primary_4)\
$python\
$golang\
$nodejs\
$docker_context\
[](fg:primary_4 bg:primary_3)\
[](fg:primary_3 bg:primary_2)\
[](fg:primary_2 bg:primary_1)\
[ ](fg:primary_1)\
$line_break
$directory\
$character"""


[directory]
style = "fg:on_surface"
format = "  $path "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:primary_7"
format = '[[ $symbol $branch ](fg:primary_15 bg:primary_7)]($style)'

[git_status]
style = "bg:primary_7"
format = '[[($all_status$ahead_behind )](fg:primary_15 bg:primary_7)]($style)'

[nodejs]
symbol = ""
style = "bg:primary_4"
format = '[[ $symbol( $version) ](fg:primary_13 bg:primary_4)]($style)'

[golang]
symbol = ""
style = "bg:primary_4"
format = '[[ $symbol( $version) ](fg:primary_13 bg:primary_4)]($style)'

[python]
symbol = ""
style = "bg:primary_4"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:primary_13 bg:primary_4)]($style)'

[docker_context]
symbol = ""
style = "bg:primary_4"
format = '[[ $symbol( $context) ](fg:primary_13 bg:primary_4)]($style)'

[memory_usage]
symbol = "󰘚"
threshold = -1
style = "bg:primary_10 fg:primary_0"
format = "[ ($symbol:$ram_pct) ]($style)"
disabled = false

[time]
disabled = false
time_format = "%I:%M%p"
style = "bg:primary_13"
format = '[[  $time ](fg:primary_4 bg:primary_13)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:tertiary)'
error_symbol = '[❯](bold fg:error)'
vimcmd_symbol = '[❮](bold fg:tertiary)'
vimcmd_replace_one_symbol = '[❮](bold fg:primary)'
vimcmd_replace_symbol = '[❮](bold fg:primary)'
vimcmd_visual_symbol = '[❮](bold fg:on_surface)'

[cmd_duration]
show_milliseconds = true
format = "[ in $duration]($style)"
style = "bg:primary_11 fg:primary_1"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[custom.ci]
description = "GitHub Actions build for the last pushed commit (fed by ci-poll)"
# THE 500ms CAP IS WHY THIS READS A FILE. starship runs a custom module's
# command on every prompt and kills it at 500ms, so this must never touch the
# network: ci-poll (home/scripts.nix) polls GitHub in the background and leaves
# one short line in tmpfs. `when` is the gate, `cat` is the command -- 8ms.
#
# shell is pinned deliberately. STARSHIP_SHELL here is fish, and in fish an
# unset XDG_RUNTIME_DIR makes the argument vanish, leaving `test -s` testing the
# string "-s" -- TRUE -- after which `cat` gets no argument and blocks on stdin
# for the full 500ms every prompt. Under sh it collapses to /volnixos-ci,
# test -s is false, and the segment hides.
shell = ["sh"]
when = "test -s $XDG_RUNTIME_DIR/volnixos-ci"
command = "cat $XDG_RUNTIME_DIR/volnixos-ci"
style = "bg:primary_7"
format = '[[ $output ](fg:primary_15 bg:primary_7)]($style)'

