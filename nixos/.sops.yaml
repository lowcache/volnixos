keys:
  - &user age1fdm66yk5su3yrndfqcm65rs8kdpqk8zxgjwxhxglgu979epd0vrs8whemn
  - &host age1eweg3j5nlwyt7n2n6s5tqfv7tpr2afxl3jk8u307xvwgq904sgfqc763mk
creation_rules:
  # Host-scoped secrets: admin user + host can decrypt
  - path_regex: host-secrets\.yaml$
    key_groups:
      - age:
        - *user
        - *host
  # VM-scoped secrets: host key only. net-gate gets the host SSH key over
  # virtio-fs, so it can decrypt this file. CAVEAT: that same key is also a
  # recipient of host-secrets.yaml above, so the guest could decrypt that too
  # if it obtained the file. Fix is a dedicated net-gate key (see todo).
  - path_regex: vm-secrets\.yaml$
    key_groups:
      - age:
        - *host
