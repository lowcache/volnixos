# Builds the volnix system closure (and MicroVM runners) on every push to
# main, pushing all newly built store paths to cachix:volnixos.
#
# Bootstrap order matters: this must push at least once before hosts can
# pull. Trust is wired on the host side in nixos/modules/nix-settings.nix
# (substituters + trustedPublicKeys).
#
# Required secret: CACHIX_AUTH_TOKEN (account-scoped bearer token from
# app.cachix.org). Public key lives in plain sight in nix-settings.nix.
name: build

on:
  push:
    branches: [main]
    # Documentation cannot change the closure, and this build takes the better
    # part of an hour. Without this, a README push starts a pointless run AND --
    # via cancel-in-progress below -- kills the real build already in flight.
    # That is not hypothetical: runs 33042848288 and 33043174328 were both
    # cancelled mid-build by doc-only pushes. A workflow that never starts
    # cannot cancel anything.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel superseded runs on the same branch; saves minutes and disk churn. Kept
# deliberately: for a real config change, superseding IS what you want.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 360 is the ceiling: GitHub-hosted runners terminate any job at 6 h
    # regardless of what is set here, so this is the limit, not a budget.
    # It used to be short (90, then 250) to fail fast when a substituter
    # regressed and the kernel fell back to a source build -- but the
    # "Assert the kernel is a cache hit" step below now catches exactly that
    # in about a minute, so a short timeout only capped legitimate work.
    # Run 35299186456 attempt 1 proved the point: a 623-commit nixpkgs jump
    # meant ~1854 source builds, and it was killed at 250 min while
    # generating the last systemd units -- minutes from done.
    timeout-minutes: 360
    env:
      # These CANNOT live in install-nix-action's extra_nix_config. That writes
      # /etc/nix/nix.conf, and cachix-action then points NIX_USER_CONF_FILES at
      # its own nix.conf which ASSIGNS substituters -- replacing the accumulated
      # value rather than extending it, so the attic silently disappeared. Run
      # 33035377085 had the attic configured, logged it at install time, and
      # still compiled the kernel for 90 minutes using only cache.nixos.org and
      # volnixos. NIX_CONFIG is read after every config file, so extra-* here
      # appends to whatever cachix-action leaves behind.
      NIX_CONFIG: |
        extra-substituters = https://attic.xuyh0120.win/lantian https://nix-community.cachix.org https://cache.lix.systems https://cache.numtide.com
        extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.lix.systems:aBnZU3F19808R5N0sczBmsWwI5YI+433R9M2iS2Hcy4= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    steps:
      # Standard runners ship ~25 GB of preinstalled toolchains we don't need;
      # the volnix closure (kernel + desktop + noctalia source build) won't
      # fit in the remaining free space otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /imagegeneration || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: volnixos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # The whole job hinges on the kernel being a download. Ask before spending
      # 90 minutes finding out: a dry-run names every path that would be BUILT,
      # and the runner cannot build this kernel inside the job limit. Failing
      # here costs a minute and says exactly which substituter went missing --
      # keep this list in sync with nixos/modules/nix-settings.nix.
      - name: Assert the kernel is a cache hit
        run: |
          echo "effective substituters:"
          nix config show substituters
          nix build --dry-run .#nixosConfigurations.volnix.config.system.build.toplevel 2>&1 | tee /tmp/dry.txt
          # Match the KERNEL derivation ONLY -- anchored to the store path so the
          # name must begin immediately after the hash. Three other cachyos
          # derivations are built here legitimately and must not trip this:
          #   ...-linux-cachyos-latest-<ver>-modules.drv         per-config aggregation
          #   ...-linux-cachyos-latest-<ver>-modules-shrunk.drv  ditto
          #   ...-initrd-linux-cachyos-latest-<ver>.drv          host-specific initrd
          # All three are cheap, are in nobody's cache, and are built on every
          # host too. The unanchored pattern matched the initrd as a substring.
          if grep -qE "/nix/store/[a-z0-9]+-linux-cachyos-latest-[0-9.]+\.drv" /tmp/dry.txt; then
            echo "::error::the kernel ITSELF would be built from source -- check the effective substituter list above for the lantian attic"
            exit 1
          fi
          echo "kernel resolves to a substitute; proceeding"

      # -L: full logs. Toplevel first so a host-breaking change fails fast
      # before spending time on VM runners.
      - name: Build volnix toplevel
        run: nix build -L .#nixosConfigurations.volnix.config.system.build.toplevel

      - name: Build MicroVM runners
        run: |
          nix build -L \
            .#packages.x86_64-linux.net-gate \
            .#packages.x86_64-linux.tailscale-vm

      # Same gate as `make check` (formatting + statix + deadnix).
      - name: Checks (fmt + lint)
        run: |
          nix build -L \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.lint
